# =====================================================================
#  GhastRider — определения кастомных предметов (Standalone)
# =====================================================================
#  Плагин сам генерирует ItemStack'и по этим описаниям и помечает их
#  PDC-ключом ghastrider:custom_item для защиты от подделок ванильными
#  предметами. Менять можно material, custom-model-data, имя, лор, glow.
#  ID предмета (ключ секции) менять НЕ рекомендуется — он используется
#  в config.yml (привязка тиров), recipes.yml и в команде /gr give.
# =====================================================================

items:
  # ---------------------- Упряжки (5 тиров) ----------------------
  base_harness:
    material: SADDLE
    custom-model-data: 1000
    display-name: "<gradient:#c0c0c0:#ffffff><b>Базовая упряжка</b></gradient>"
