      - "<gray>Простая сбруя для управления Счастливым Гастом."
      - "<dark_gray>Тир: <white>Базовая</white>"
      - ""
      - "<dark_gray>ПКМ по Счастливому Гасту, чтобы надеть."
    glow: false

