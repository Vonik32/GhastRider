# =====================================================================
#  GhastRider — рецепты крафта (Standalone)
# =====================================================================
#  Все рецепты — нативные ShapedRecipe через Bukkit.addRecipe().
#  Безопасность: для type=custom используется RecipeChoice.ExactChoice,
#  то есть подмена обычной звездой Незера/седлом не сработает —
#  ItemStack.isSimilar() сверит ItemMeta и PDC-маркер ghastrider:custom_item.
#
#  shape: 1..3 строк по 1..3 символа. Пробел = пусто.
#  ingredients: маппинг символ -> {type: vanilla|custom, ...}.
# =====================================================================

recipes:
  # ---------------------- Эссенции ---------------------------------
  essence_speed_1:
    result: essence_speed_1
    amount: 1
    shape:
      - " F "
      - "FNF"
      - " F "
    ingredients:
      F:
        type: vanilla
        material: FEATHER
      N:
        type: vanilla
        material: NETHER_STAR

